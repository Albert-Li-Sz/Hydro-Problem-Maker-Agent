<svg xmlns="http://www.w3.org/2000/svg" width="440" height="120" viewBox="0 0 440 120" role="img" aria-labelledby="title desc">
  <title id="title">整数加法示意图</title>
  <desc id="desc">两个整数经过加法运算得到结果</desc>
  <rect width="440" height="120" rx="8" fill="#edf0f2"/>
  <rect x="20" y="30" width="100" height="60" rx="6" fill="#fff" stroke="#5f9fd6" stroke-width="2"/>
  <rect x="170" y="30" width="100" height="60" rx="6" fill="#fff" stroke="#5f9fd6" stroke-width="2"/>
  <rect x="320" y="30" width="100" height="60" rx="6" fill="#fff" stroke="#ed5f82" stroke-width="2"/>
  <text x="70" y="68" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#555">a</text>
  <text x="145" y="68" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#555">+</text>
  <text x="220" y="68" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#555">b</text>
  <text x="295" y="68" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#555">=</text>
  <text x="370" y="68" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#555">a+b</text>
</svg>
